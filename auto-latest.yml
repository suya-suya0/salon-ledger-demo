name: Auto publish latest Salon Ledger

on:
  push:
    branches: [main]
    paths:
      - 'index_v*.html'
      - '.github/workflows/auto-latest.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: salon-ledger-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select latest version and update index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          pattern = re.compile(r'^index_v(\d+(?:\.\d+)*)\.html$', re.I)
          versions = []
          for file in Path('.').iterdir():
              match = pattern.fullmatch(file.name) if file.is_file() else None
              if match:
                  versions.append((tuple(map(int, match.group(1).split('.'))), file))
          if not versions:
              raise SystemExit('Versioned HTML not found. Upload index_v3.html, for example.')
          version, latest = max(versions, key=lambda item: (item[0], item[1].name))
          if not latest.read_bytes().strip():
              raise SystemExit(f'{latest} is empty. Aborting.')
          shutil.copyfile(latest, 'index.html')
          print(f'Selected {latest} -> index.html (version {".".join(map(str,version))})')
          PY

      - name: Commit index.html to repository if changed
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Auto update index.html from latest version"
            git push origin HEAD:main
          else
            echo "index.html is already current"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
